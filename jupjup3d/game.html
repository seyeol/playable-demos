<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>골드 마블 세이렌</title>
	<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
body {
	color: white;
	background-color: #0d1421;
	overflow: hidden;
	touch-action: none;
	font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
#canvas { display: block; }
#canvas:focus { outline: none; }

/* 로딩 오버레이 — 풀스크린 다크 네이비 + 중앙 로고 + 진행바 */
#status {
	position: absolute;
	top: 0; left: 0; right: 0; bottom: 0;
	background-color: #0d1421;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: visible;
	z-index: 10;
}
#status-splash {
	max-width: 80%;
	max-height: 50%;
	margin: auto 0;
	object-fit: contain;
	user-select: none;
	-webkit-user-select: none;
	pointer-events: none;
	animation: gentlePulse 2s ease-in-out infinite;
}
@keyframes gentlePulse {
	0%, 100% { transform: scale(1.0); opacity: 0.95; }
	50%      { transform: scale(1.02); opacity: 1.0; }
}
/* 노란 진행바 — 게임 컬러 */
#status-progress-wrap {
	width: 60%;
	max-width: 480px;
	height: 22px;
	background-color: rgba(255,255,255,0.1);
	border-radius: 11px;
	overflow: hidden;
	margin: 24px 0 12px 0;
	box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
}
#status-progress-bar {
	height: 100%;
	width: 0%;
	background: linear-gradient(90deg, #FFB940 0%, #FFD740 100%);
	border-radius: 11px;
	transition: width 0.2s ease-out;
	box-shadow: 0 0 12px rgba(255, 215, 64, 0.5);
}
#status-progress-bar.indeterminate {
	width: 30%;
	animation: indeterminate 1.5s ease-in-out infinite;
}
@keyframes indeterminate {
	0%   { margin-left: -30%; width: 30%; }
	50%  { margin-left: 50%;  width: 50%; }
	100% { margin-left: 100%; width: 30%; }
}
#status-text {
	color: #BBE0FF;
	font-size: 16px;
	letter-spacing: 0.5px;
	margin-top: 4px;
	text-align: center;
	min-height: 22px;
}
#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	line-height: 1.3;
	margin: 1rem 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	display: none;
}
<link id="-gd-engine-icon" rel="icon" type="image/png" href="game.icon.png" />
<link rel="apple-touch-icon" href="game.apple-touch-icon.png"/>

	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="골드 마블 세이렌.icon.png" />
	<link rel="apple-touch-icon" href="골드 마블 세이렌.apple-touch-icon.png"/>
</head>
<body>
	<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
	<noscript>JavaScript 를 활성화해주세요.</noscript>

	<div id="status">
		<img id="status-splash" src="title_logo_splash.png" alt="Gold Marble Seiren">
		<div id="status-progress-wrap">
			<div id="status-progress-bar" class="indeterminate"></div>
		</div>
		<div id="status-text">게임 다운로드 중...</div>
		<div id="status-notice"></div>
	</div>

	<script src="game.js"></script>
	<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"game","experimentalVK":false,"fileSizes":{"game.pck":22493168,"game.wasm":43682606},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusBar = document.getElementById('status-progress-bar');
	const statusText = document.getElementById('status-text');
	const statusNotice = document.getElementById('status-notice');
	let initializing = true;

	function setNotice(text) {
		statusNotice.textContent = text;
		statusNotice.style.display = 'block';
		statusText.style.display = 'none';
	}

	function fail(err) {
		console.error(err);
		setNotice(typeof err === 'string' ? err : (err.message || '오류가 발생했습니다.'));
		initializing = false;
	}

	function setProgress(current, total) {
		if (current > 0 && total > 0) {
			const pct = Math.min(100, (current / total) * 100);
			statusBar.classList.remove('indeterminate');
			statusBar.style.width = pct.toFixed(1) + '%';
			statusText.textContent = '게임 다운로드 중... ' + Math.round(pct) + '%';
		} else {
			statusBar.classList.add('indeterminate');
			statusText.textContent = '게임 다운로드 중...';
		}
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('이 브라우저는 지원되지 않습니다.\n' + missing.join('\n'));
	} else {
		engine.startGame({
			'onProgress': setProgress,
		}).then(() => {
			// 페이드아웃 후 제거
			statusText.textContent = '준비 완료';
			statusBar.style.width = '100%';
			statusOverlay.style.transition = 'opacity 0.4s ease-out';
			statusOverlay.style.opacity = '0';
			setTimeout(() => statusOverlay.remove(), 400);
			initializing = false;
		}, fail);
	}
}());
	</script>
</body>
</html>
